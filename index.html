<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Svarog Team birthdays</title>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="login-wrapper">
         <h1>SVAROG TEAM</h1>
        <div id="authBlock">

    <input type="email"
           id="email"
           placeholder="Email">

    <input type="password"
           id="password"
           placeholder="Пароль">

    <button id="loginBtn">
        Увійти
    </button>

</div>
    </div>
    <div class="container" id="calendarContent" style="display:none;">
        <div class="hero">

            <span class="hero-label">
                SVAROG TEAM
            </span>

            <h1>
                Дні народження
            </h1>

        </div>

        <div class="today-card section-box hidden" id="todayBirthdays">
            <h2>Дні народження сьогодні</h2>
            <div id="todayList"></div>
        </div>

        <div class="calendar-controls"></div>
        <div id="calendar"></div>

        <div class="upcoming section-box">
            <h2>Найближчі Дні народження</h2>
            <div id="upcomingList"></div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/locales-all.global.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
